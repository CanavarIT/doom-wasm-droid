name: Build Doom WASM

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autoconf libtool pkg-config libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Activate Emscripten Environment
        run: |
          source "$EMSDK/emsdk_env.sh"
          emcc --version
          echo "$EMSDK" >> $GITHUB_PATH
          echo "$EMSDK/upstream/emscripten" >> $GITHUB_PATH

      - name: Build (patched)
        run: |
          chmod +x scripts/*.sh
          # Обходим проблемную проверку Autotools
          export ac_cv_func_malloc_0_nonnull=yes
          export ac_cv_func_realloc_0_nonnull=yes
          export CC=emcc
          export CXX=em++
          export EMCC_CFLAGS="-s USE_SDL=2 -s USE_SDL_MIXER=2 -s USE_SDL_NET=2"
          
          ./scripts/clean.sh
          ./scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doom-wasm-build
          path: |
            src/*.js
            src/*.wasm
