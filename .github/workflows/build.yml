name: Build Doom WASM

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autoconf libtool pkg-config libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev

      - name: Setup Emscripten (OLD VERSION)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.25'

      - name: Activate Emscripten Environment
        run: |
          source "$EMSDK/emsdk_env.sh"
          emcc --version
          echo "$EMSDK" >> $GITHUB_PATH
          echo "$EMSDK/upstream/emscripten" >> $GITHUB_PATH

      - name: Build
        run: |
          chmod +x scripts/*.sh
          ./scripts/clean.sh
          
          # ВШИВАЕМ WAD В СБОРКУ!
          export EMCC_CFLAGS="--preload-file doom1.wad"
          
          ./scripts/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doom-wasm-build
          path: |
            src/*.js
            src/*.wasm
            src/*.data
